  title: "PyPSA-Zambia Tutorial Weather Cutout"
  description: |
    <p>
      This record provides the <strong>PyPSA-Zambia Tutorial Weather
      Cutout</strong>, a minimal and curated collection of weather inputs
      required to execute the testing and tutorial versions of the
      PyPSA-Zambia workflow.
    </p>

    <p>
      The cutout has been prepared for the <strong>2013 weather year</strong>.
    </p>

