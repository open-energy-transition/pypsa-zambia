run:
  name: validation_dispatch_zambia_2023

snapshots:
  start: '2023-01-01'
  end: '2024-01-01'

atlite:
  default: cutout-2023-era5
  hydro: hydro/zm-2023-glofas.nc

renewable:
  hydro:
    normalization:
      year: 2023

load_options:
  weather_year: 2023
  scale: 0.9 #0.85  # scaled the model demand by a factor of 14.4/19.34 to match the national value

validation:
  # TODO Get back once #243 is fixed
  interconnectors:
    enable: false
    download_data: false
  custom_powerplants:
    enable: true
    download_data: true
  line_types:
    download_data: true
  mining_data:
    download_data: true
  biomass:
    download_data: true

data:
  custom-powerplants:
    # parameters of powerplants correspond to the real state of the national power system
    version: v4
  cutout-era5:
    year: 2023
  inflow-glofas:
    year: 2023
