# =================== STUDY SETUP ===================
run:
  name: "" # optional; stores intermediate files in a subfolder (e.g. "ZM" → resources/ZM/, results/ZM/); empty = no subfolder
  shared_cutouts: true # true: cutouts/ shared across runs; false: cutouts/{name}/ per run

scenario:
  simpl: ['']
  ll: [v1.0]
  clusters: ['10']
  opts: [Co2L-3h]

snapshots:
  start: '2013-01-01'
  end: '2014-01-01'
  inclusive: left   # end is not inclusive
countries: [ZM]


# =================== DATA RETRIEVAL ===================
enable:
  # ----------------- Retrieving data -----------------
  retrieve_databundle: false # recommended for first run
  retrieve_cutout: false # retrieves the bundled 2013 cutout (cutout-2013-era5); changing load_options.weather_year (default: 2013) requires retrieve_cutout:false and build_cutout: true.
  retrieve_cost_data: false # false: use existing data/costs.csv
  download_global_buildings: false # download GlobalMLBuildingFootprints data for the countries specified above
  # ----------------- Building locally -----------------
  build_cutout: false
  # If "build_cutout" : true, then environmental data is extracted according to `snapshots` date range and `countries`
  # requires cds API key https://cds.climate.copernicus.eu/api-how-to
  # More information https://atlite.readthedocs.io/en/latest/introduction.html#datasets
  build_natura_raster: false


# =================== GEOGRAPHY & SHAPES ===================
# ------------------- Clustering -------------------
clustering:
  simplify_network:
    p_threshold_drop_isolated: 100  # MW — drop isolated subnetworks with load below this threshold


# =================== NETWORK & RESOURCES ===================

# ------------------- Demand -------------------
load_options:
  source: "gegis" # "gegis" (scenario-based: 2011, 2013, 2018 available) or "demcast" (hourly 2000–2024 available): view [issue #1724](https://github.com/pypsa-meets-earth/pypsa-earth/issues/1724) for more details
  weather_year: 2013 # Weather year of the load profile
  prediction_year: 2030 # Valid only if "gegis" used as a source
  demand_weights:
    mining: 0.76
    gdp: 0.24
  zambia_demand_distribution: true

electricity:
  # ----------------- Electricity generation -------------------
  extendable_carriers:
    Generator: []
    StorageUnit: [] # battery, H2
    Store: []
    Link: []

  conventional_carriers: [oil, OCGT, CCGT, coal, geothermal, biomass]
  renewable_carriers: [solar, onwind, hydro]

  # ----------------- Grid topology -------------------
  base_voltage: 330.
  voltages: [66., 88., 132., 220., 330.]

  # ----------------- Existing powerplants -------------------
  powerplants_filter: (DateOut >= 2024 or DateOut != DateOut) and (DateIn <= 2024 or DateIn != DateIn)
  custom_powerplants: replace # set to "merge" or "replace" if you have a custom_powerplants.csv for Zambia
  disaggregate_powerplants: false # to enable disaggregation also in simplify_network, a set of excluded carries must be specified

  estimate_renewable_capacities:
    stats: false # False, = greenfield expansion, wind and solar generation provided by the custom powerplants file
  operational_reserve:
    activate: false

lines:
  ac_types:
    66.: ACSR Wolf 66.0
    132.: ACSR Panther 132.0
    220.: ACSR Zebra 220.0
    330.: ACSR Bison 330.0
  s_max_pu: 0.7
  s_nom_extendable: false

# ------------------- Weather & renewables -------------------
atlite:
  nprocesses: 4
  default: cutout-2013-era5
  hydro: hydro/zm-2013-glofas.nc

renewable:
  hydro:
    source: custom # use "era5" for a regular cutout workflow and "custom" for custom renewable profiles
    extendable: false
    normalization:
      method: irena
      year: 2013
    multiplier: 10 # has different meaning for custom and era5 sources

# ------------------- Costs & emissions -------------------
costs:
  year: 2025
  investment: # EUR/MW — IRP Table 5 (Zambia 2023), converted at 0.7532 EUR/USD
    hydro: 2862160       # 3.800 mUSD/MW — Hydro Storage
    ror: 965602          # 1.282 mUSD/MW — Hydro Run-of-River
    coal: 807430         # 1.072 mUSD/MW — Coal Thermal
    geothermal: 1205120  # 1.600 mUSD/MW — Geothermal
    biomass: 474516      # 0.630 mUSD/MW — Biomass
    solar-utility: 756966  # 1.005 mUSD/MW — Solar PV (utility-scale)
    onwind: 969368       # 1.287 mUSD/MW — Wind Onshore
    nuclear: 4865672     # 6.460 mUSD/MW — Nuclear
    csp-tower: 4973380   # 6.603 mUSD/MW — Solar CSP
    oil: 506904          # 0.673 mUSD/MW — Mixed Fuel
  marginal_cost: # EUR/MWh — IRP Table 5 (Zambia 2023), converted at 0.7532 EUR/USD
    solar: 0
    onwind: 0
    offwind: 0.015
    hydro: 1.05
    ror: 0.
    coal: 72.92
    oil: 4.23
    geothermal: 0.87
    biomass: 4.14
    nuclear: 3.46
    csp: 0.
  co2_emissions: # tCO2/MWh — IRP Table 5 (Zambia 2023)
    hydro: 0.025
    ror: 0.024
    coal: 0.830
    geothermal: 0.038
    biomass: 0.038
    solar: 0.048
    onwind: 0.011
    nuclear: 0.012
    csp-tower: 0.000
    oil: 0.490
  lifetime: # years — IRP Table 5 (Zambia 2023)
    hydro: 50
    ror: 35
    coal: 40
    geothermal: 35
    biomass: 25
    solar: 25
    onwind: 30
    nuclear: 50
    csp-tower: 25
    oil: 30

co2:
  emission_price: 0. # [currency/tCO2]; active via Ep wildcard
  automatic_emission: # derive co2.limit from historical emission data instead of the value above
    enable: true
    base_year: 1990  # any year from 1970 to 2018


# =================== Plotting ===================
cap_exp_scenarios:
  zm.cap_exp_2025: "cap_exp 2025"
  zm.cap_exp_2030: "cap_exp 2030"
  zm.cap_exp_2040: "cap_exp 2040"
  zm.cap_exp_2050: "cap_exp 2050"

plotting:
  scenario_comparison:
    # Each key defines one comparison group; the key itself is used as both the output folder name under results/comparison_plots/ and the target name for
    # `snakemake results/comparison_plots/<key>`. `snakemake compare_scenarios` builds every group defined here.
    # You can use snakemake -j 1 compare_scenarios to run the plotting comparison
    capacity_expansion:
      exclude_carriers:
      - "load shedding"

    dispatch_validation:
      scenario_filter:
      - "validation_dispatch_zambia_2023"
      - "validation_dispatch_zambia_2024"
      exclude_carriers:
      - "load shedding"
      reference_data:   # generation data, imports and exports data are available from ERB Zambia (https://www.erb.org.zm/).
      - generation


validation:
  # TODO Get back once #243 is fixed
  interconnectors:
    enable: false
    download_data: false
  custom_powerplants:
    enable: true
    download_data: true
  line_types:
    download_data: true
  mining_data:
    download_data: true
  biomass:
    download_data: true


data:
  custom-powerplants:
    source: primary
    # parameters of powerplants correspond to the real state of the national power system
    version: v4
  zm-biomass:
    source: primary
    version: v1.0
  cutout-era5:
    source: primary
    version: v1.0
    # NB Must be adjusted according to the weather year
    year: 2013
  hydrobasins:
    source: build
    version: latest
  irena:
    source: primary
    version: latest
  landcover:
    source: primary
    version: Mar2026
  natura_earth:
    source: tutorial
    version: v1.0
  inflow-glofas:
    source: primary
    version: v1.0
    # NB Must be adjusted according to the weather year
    year: 2013


# =================== SOLVING ===================
solving:
  solver:
    name: highs
    options: highs-default
