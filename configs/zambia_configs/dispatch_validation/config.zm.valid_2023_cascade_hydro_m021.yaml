run:
  name: config.zm.valid_2023_cascade_hydro_m021
  base_config: configs/zambia_configs/config.zm.validation_dispatch.yaml
snapshots:
  start: '2023-01-01'
  end: '2024-01-01'
  inclusive: left
countries:
- ZM
scenario:
  simpl:
  - ''
  ll:
  - v1.0
  clusters:
  - '10'
  opts:
  - 3h
atlite:
  nprocesses: 4
  default: cutout-2023-era5
  hydro: hydro/zm-2023-glofas.nc
electricity:
  powerplants_filter: (DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)
  extendable_carriers:
    Generator: []
  custom_powerplants:
    filepaths:
    - data/custom_powerplants.zm.valid_2023.hydro_corrected.csv
    method: replace
lines:
  s_max_pu: 0.7
renewable:
  hydro:
    source: custom
    multiplier: 0.21
    cascading:
      enable: true
load_options:
  source: demcast
  weather_year: 2023
  scale: 0.9
costs:
  year: 2020
co2:
  automatic_emission:
    enable: false
validation:
  interconnectors:
    enable: true
